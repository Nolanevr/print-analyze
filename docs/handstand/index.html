<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1514" media="(prefers-color-scheme: dark)">
<meta name="description" content="Beginner calisthenics and handstand plan with guided workouts, timers, XP and streaks.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Handstand Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handstand Plan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column, sticky header with level strip, bottom tab bar, timer dock above the tabs, full-screen guided workout */
:root {
  --bg: #EDF1F0;
  --surface: #FFFFFF;
  --ink: #13201E;
  --muted: #5A6B67;
  --line: #D3DDDA;
  --accent: #0A7563;
  --accent-ink: #FFFFFF;
  --accent-soft: #D4ECE6;
  --warm: #B9520B;
  --warm-soft: #FAE4D3;
  --gold: #B88207;
  --gold-soft: #F8EBC6;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1514; --surface: #172120; --ink: #E4EDEB; --muted: #93A6A2; --line: #2A3734;
    --accent: #3DC4A7; --accent-ink: #052019; --accent-soft: #17392F; --warm: #F28C47; --warm-soft: #3B2415;
    --gold: #E8B83A; --gold-soft: #3A2F12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1514; --surface: #172120; --ink: #E4EDEB; --muted: #93A6A2; --line: #2A3734;
  --accent: #3DC4A7; --accent-ink: #052019; --accent-soft: #17392F; --warm: #F28C47; --warm-soft: #3B2415;
  --gold: #E8B83A; --gold-soft: #3A2F12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.guiding { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px));
}
body.timing .app { padding-bottom: calc(var(--tabbar) + 150px + env(safe-area-inset-bottom, 0px)); }

h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.eyebrow { font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-block: 12px 10px; display: grid; gap: 10px;
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { white-space: nowrap; font-size: 22px; font-weight: 800; font-stretch: 75%; letter-spacing: -.01em; text-transform: uppercase; }
.xp { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; min-width: 0; flex: 0 1 190px; border: 0; background: transparent; padding: 0; text-align: left; }
.lv { grid-row: 1 / span 2; font-family: var(--font-display); font-stretch: 75%; font-weight: 800; font-size: 13px; background: var(--gold-soft); color: var(--ink); border: 1.5px solid var(--gold); border-radius: 9px; padding: 4px 7px; line-height: 1.1; text-align: center; }
.lv b { display: block; font-size: 20px; }
.xpname { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; gap: 6px; }
.xpname span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.xpbar { height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; }
.xpbar span { display: block; height: 100%; background: var(--gold); transition: width .5s; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 6px 0 7px; display: grid; justify-items: center; gap: 2px; min-width: 0;
}
.day b { font-family: var(--font-display); font-stretch: 80%; font-size: 13px; font-weight: 700; text-transform: uppercase; }
.day small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.day.hard i { background: transparent; border: 1.5px solid var(--muted); }
.day.done i { background: var(--accent); border: 0; }
.day.today { border-color: var(--accent); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day[aria-pressed="true"] small { color: inherit; opacity: .7; }

/* views */
.view { display: grid; gap: 16px; padding-top: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.session-head { display: grid; gap: 6px; }
.session-head h2 { font-size: 30px; font-weight: 800; font-stretch: 78%; line-height: 1.02; text-transform: uppercase; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.chip.warm { background: var(--warm-soft); }
.chip.gold { background: var(--gold-soft); }
.lede { color: var(--muted); margin: 0; }
.nudge { margin: 0; font-weight: 600; font-size: 15px; padding: 10px 12px; border-radius: 10px; background: var(--gold-soft); }
.why { margin: 0; font-style: italic; color: var(--muted); font-size: 14px; }
.why b { font-style: normal; color: var(--ink); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.progress-row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.block { display: grid; gap: 8px; }
.block-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-inline: 2px; }
.block-title h3 { font-size: 17px; font-weight: 700; font-stretch: 85%; text-transform: uppercase; letter-spacing: .02em; }
.block-title span { font-size: 12px; color: var(--muted); }

.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 12px 14px; display: grid; gap: 10px; }
.ex.complete { border-color: var(--accent); }
.ex-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.ex-name { font-weight: 600; font-size: 16px; min-width: 0; }
.code { font-family: var(--font-display); font-stretch: 80%; font-weight: 700; font-size: 12px; color: var(--accent); margin-left: 4px; }
.ex-dose { font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ex-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pips { display: flex; gap: 6px; flex-wrap: wrap; }
.pip {
  width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.pip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check {
  display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: transparent;
  border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px;
}
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.go {
  border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 14px;
  background: var(--warm-soft); color: var(--ink); display: inline-flex; gap: 6px; align-items: center;
}
.go svg { width: 14px; height: 14px; fill: var(--warm); }
details.cue summary { list-style: none; font-size: 13px; color: var(--muted); cursor: pointer; }
details.cue summary::-webkit-details-marker { display: none; }
details.cue summary::before { content: "+ "; font-weight: 700; color: var(--accent); }
details.cue[open] summary::before { content: "– "; }
details.cue p, details.cue ol, details.cue ul { margin: 6px 0 0; color: var(--ink); font-size: 14px; }
details.cue ol, details.cue ul { padding-left: 20px; display: grid; gap: 4px; }
.note { font-size: 13px; color: var(--muted); padding-inline: 2px; margin: 0; }

.btn {
  border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 700; font-size: 15px;
  background: var(--accent); color: var(--accent-ink); width: 100%;
}
.btn.big { padding: 18px 16px; font-size: 19px; font-family: var(--font-display); font-stretch: 85%; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.big svg { width: 20px; height: 20px; fill: currentColor; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.soft { background: var(--gold-soft); color: var(--ink); border: 1.5px solid var(--gold); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }

/* moves & lists */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.list { display: grid; gap: 0; }
.li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; padding-top: 0; }
.li .tag { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 18px; color: var(--accent); line-height: 1.2; }
.li b { display: block; font-weight: 600; }
.li p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

/* handstand steps */
.steps { display: grid; gap: 8px; }
.step {
  display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; text-align: left;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px;
}
.step .n { font-family: var(--font-display); font-stretch: 75%; font-weight: 800; font-size: 32px; line-height: .9; color: var(--muted); }
.step b { display: block; font-size: 16px; }
.step span { color: var(--muted); font-size: 14px; }
.step.past .n { color: var(--accent); }
.step.cur { border-color: var(--accent); background: var(--accent-soft); }
.step.cur .n { color: var(--accent); }
.step .you { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
ul.rules { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

/* wins */
.lvl-card { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; }
.lvl-num { grid-row: 1 / span 3; width: 84px; height: 84px; border-radius: 20px; background: var(--gold-soft); border: 2px solid var(--gold); display: grid; place-content: center; text-align: center; }
.lvl-num small { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.lvl-num b { font-family: var(--font-display); font-stretch: 70%; font-weight: 800; font-size: 44px; line-height: .9; }
.lvl-card h2 { font-size: 24px; font-stretch: 78%; text-transform: uppercase; line-height: 1.05; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-display); font-stretch: 75%; font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat small { font-size: 12px; color: var(--muted); }
.weekdots { display: flex; gap: 8px; }
.weekdots i { flex: 1; height: 14px; border-radius: 7px; background: var(--line); }
.weekdots i.on { background: var(--accent); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.badge { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 8px; display: grid; justify-items: center; text-align: center; gap: 6px; background: var(--surface); min-width: 0; }
.badge svg { width: 34px; height: 34px; }
.badge .ring { fill: var(--line); }
.badge .glyph { fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.badge b { font-size: 13px; line-height: 1.2; }
.badge small { font-size: 11px; color: var(--muted); line-height: 1.3; }
.badge.got { border-color: var(--gold); background: var(--gold-soft); }
.badge.got .ring { fill: var(--gold); }
.badge.got .glyph { stroke: var(--surface); }
textarea { width: 100%; min-height: 70px; resize: vertical; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; color: var(--ink); background: var(--bg); }

/* timer */
.clock-big { font-family: var(--font-display); font-stretch: 70%; font-weight: 800; font-size: 96px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.preset { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 4px; display: grid; justify-items: center; }
.preset b { font-family: var(--font-display); font-stretch: 80%; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.preset small { font-size: 11px; color: var(--muted); }

.dock {
  position: fixed; left: 0; right: 0; z-index: 25;
  bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 8px;
}
.dock-in {
  max-width: 528px; margin: 0 auto; border-radius: 16px; padding: 12px 14px;
  background: var(--ink); color: var(--bg); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.dock .phase { font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.dock .phase.hold { color: var(--accent); }
.dock .phase.rest, .dock .phase.ready { color: var(--warm); }
.dock .lbl { font-size: 14px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dock .t { grid-row: 1 / span 2; grid-column: 2; font-family: var(--font-display); font-stretch: 72%; font-weight: 800; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.dock .acts { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 6px; }
.dock .acts button { flex: 1; border: 1px solid color-mix(in srgb, var(--bg) 30%, transparent); background: transparent; color: var(--bg); border-radius: 10px; padding: 8px; font-weight: 600; font-size: 14px; }
.dock .dbar { grid-column: 1 / -1; height: 4px; border-radius: 9px; background: color-mix(in srgb, var(--bg) 22%, transparent); overflow: hidden; }
.dock .dbar span { display: block; height: 100%; background: var(--warm); width: 0; }
.dock .dbar.hold span { background: var(--accent); }

/* guided workout */
.guide {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.guide-in { max-width: 520px; margin: 0 auto; min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; }
.g-top { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.g-close { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
.g-steps { display: flex; gap: 4px; }
.g-steps i { flex: 1; height: 6px; border-radius: 4px; background: var(--line); }
.g-steps i.on { background: var(--accent); }
.g-steps i.cur { background: var(--gold); }
.g-body { display: grid; align-content: center; gap: 14px; text-align: center; }
.g-body h2 { font-size: clamp(34px, 10vw, 48px); font-weight: 800; font-stretch: 72%; text-transform: uppercase; line-height: .98; }
.g-set { font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 20px; }
.g-set span { color: var(--muted); font-weight: 600; }
.g-cue { margin: 0 auto; max-width: 34ch; color: var(--muted); font-size: 15px; }
.g-list { text-align: left; margin: 0 auto; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; max-width: 40ch; }
.g-clock { font-family: var(--font-display); font-stretch: 68%; font-weight: 800; font-size: clamp(96px, 34vw, 150px); line-height: .9; font-variant-numeric: tabular-nums; }
.g-phase { font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; }
.g-phase.hold { color: var(--accent); }
.g-phase.rest, .g-phase.ready { color: var(--warm); }
.g-acts { display: grid; gap: 10px; }
.g-link { border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; padding: 6px; text-decoration: underline; text-underline-offset: 3px; }
.g-done .trophy { width: 96px; height: 96px; margin: 0 auto; }
.g-done .trophy .ring { fill: var(--gold); }
.g-done .trophy .glyph { fill: none; stroke: var(--surface); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.g-xp { font-family: var(--font-display); font-stretch: 75%; font-weight: 800; font-size: 40px; color: var(--gold); }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar); }
.tab { border: 0; background: transparent; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; min-width: 0; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }

.rest-day { text-align: center; padding: 28px 16px; }
.rest-day .big { font-family: var(--font-display); font-stretch: 72%; font-weight: 800; font-size: 64px; text-transform: uppercase; line-height: 1; }
.install { font-size: 14px; }
.install ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
.pop { position: fixed; z-index: 65; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--gold); animation: pop .9s ease-out forwards; }
@keyframes pop { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -48px); opacity: 0; } }
#confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .bar > span, .xpbar span { transition: none; } .pop { animation-duration: .01s; } }
@media (max-width: 380px) { .session-head h2 { font-size: 26px; } .clock-big { font-size: 80px; } .pip { width: 34px; height: 34px; } .xp { flex-basis: 170px; } }
</style>
</head>

function todayIdx() { return (new Date().getDay() + 6) % 7; }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parseIso(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d, 12); }
function mondayOf(d) { const m = new Date(d); m.setHours(12, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
function weekDates() {
  const mon = mondayOf(new Date());
  return DAY_KEYS.map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
}
function entry(dateKey, create) {
  let e = S.log[dateKey];
  if (!e && create) e = S.log[dateKey] = { sets: {} };
  return e || { sets: {} };
}
function loadLocal() {
  try { const j = JSON.parse(localStorage.getItem(KEY) || "null"); if (j && typeof j === "object") S = Object.assign(S, j); } catch (e) {}
  if (!Array.isArray(S.seen)) S.seen = [];
}
function save() {
  S.at = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushDb, 900);
}
async function pushDb() {
  if (!dbRef) return;
  if (writing) { writeAgain = true; return; }
  writing = true;
  try { await dbRef.set(JSON.parse(JSON.stringify(S))); syncText = "Saved to your account"; }
  catch (e) { syncText = "Saved on this phone"; }
  writing = false;
  if (writeAgain) { writeAgain = false; pushDb(); }
}
async function initDb() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    dbRef = db.collection("data/users/" + id).doc("progress");
    const snap = await dbRef.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.at || 0) > (S.at || 0)) {
      S = Object.assign({ step: 0, log: {}, at: 0, seen: [], why: "" }, JSON.parse(JSON.stringify(remote)));
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    } else if (S.at) {
      await pushDb();
    }
    syncText = "Saved to your account";
    render();
  } catch (e) { /* stay on device storage */ }
}

function toast(msg, ms = 2200) {

  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), ms);
}
function popAt(el, text) {
  if (!el || !el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect(), p = document.createElement("div");
  p.className = "pop"; p.textContent = text;
  p.style.left = r.left + r.width / 2 + "px"; p.style.top = r.top - 6 + "px";
  document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
}

const XP_SET = 10, XP_CHECK = 15, XP_FINISH = 50, XP_MINI = 30, XP_STEP = 100;

function computeStats() {

  for (const [k, e] of Object.entries(S.log || {})) {

    const { sess } = sessionOf(idx, e);
    for (const it of allItems(sess)) {

  if ((s.weeks[iso(w)] || 0) < WEEK_GOAL) w.setDate(w.getDate() - 7);

function change(fn, opts = {}) {

  newBadges.forEach((b) => S.seen.push(b.id));
  save();

  const gained = after.xp - before.xp;
  if (gained > 0 && opts.el) popAt(opts.el, "+" + gained + " XP");
  if (after.level.L > before.level.L) { celebrate(); chime(); toast("Level " + (after.level.L + 1) + ": " + after.level.name + "!", 3000); }
  else if (newBadges.length) { celebrate(true); chime(); toast("Badge unlocked: " + newBadges.map((b) => b.name).join(", "), 3000); }
  else if (before.thisWeek < WEEK_GOAL && after.thisWeek >= WEEK_GOAL) { celebrate(); chime(); toast("Weekly goal hit. That's a win.", 3000); }

}

  const dates = weekDates(), t = todayIdx();

  }

    left > 0 ? `${left} more workout${left > 1 ? "s" : ""} and this week is a win.` : "Weekly goal done. Everything now is a bonus.",

function guideState() {
  const dk = curKey(), e = entry(dk), { sess } = sessionFor(ui.dayIdx, dk);
  const items = allItems(sess);
  const cur = items.find((it) => !itemComplete(it, e) && !ui.skipped.has(it.id));
  return { dk, e, sess, items, cur };
}
function openGuide() { ui.guide = true; ui.skipped = new Set(); ui.celebrated = false; document.body.classList.add("guiding"); $("#guide").hidden = false; renderGuide(); $("#guide").scrollTop = 0; }
function closeGuide() { ui.guide = false; document.body.classList.remove("guiding"); $("#guide").hidden = true; render(); }
function renderGuide() {
  const { dk, e, sess, items, cur } = guideState();
  const steps = items.map((it) => `<i class="${itemComplete(it, e) ? "on" : it === cur ? "cur" : ""}"></i>`).join("");
  const top = `<div class="g-top"><button class="g-close" data-g="close">Close</button><div class="g-steps" aria-hidden="true">${steps}</div></div>`;
  let body, acts;
  if (!cur) {
    if (!e.done && !ui.celebrated) {
      ui.celebrated = true;
      setTimeout(() => { change(() => { entry(dk, true).done = true; }); celebrate(); chime(); }, 50);
      return;
    }
    const st = computeStats();
    body = `<div class="g-body g-done">${badgeSvg("star").replace('viewBox="0 0 24 24"', 'viewBox="0 0 24 24" class="trophy"')}
      <div class="eyebrow">Workout logged</div><h2>You did it</h2>
      <div class="g-xp">${st.xp} XP</div>
      <p class="g-cue">${st.thisWeek >= WEEK_GOAL ? "Weekly goal done. Everything else this week is a bonus." : `${st.thisWeek} of ${WEEK_GOAL} this week. ${WEEK_GOAL - st.thisWeek} to go.`}</p></div>`;
    acts = `<div class="g-acts"><button class="btn big" data-g="close">Finish</button><button class="g-link" data-g="wins">See my wins</button></div>`;
  } else {
    const idx = items.indexOf(cur) + 1;
    const head = `<div class="eyebrow">${idx} of ${items.length}</div>`;
    if (cur.k === "warm" || cur.k === "mob") {
      const list = cur.k === "warm" ? WARMUP.map((w) => `<li><b>${w[1]}.</b> ${esc(w[2])}</li>`).join("") : MOBILITY.map((m) => `<li><b>${esc(m[0])}:</b> ${esc(m[2])}</li>`).join("");
      body = `<div class="g-body">${head}<h2>${cur.k === "warm" ? "Warm-up" : "Mobility"}</h2>
        <div class="g-set">${cur.k === "warm" ? "5-8 min" : "12-15 min"} <span>· go down the list</span></div>
        <${cur.k === "warm" ? "ol" : "ul"} class="g-list">${list}</${cur.k === "warm" ? "ol" : "ul"}></div>`;
      acts = `<div class="g-acts"><button class="btn big" data-g="check" data-id="${cur.id}">Done</button><button class="g-link" data-g="skip" data-id="${cur.id}">Skip this one</button></div>`;
    } else {
      const n = e.sets[cur.id] || 0;
      const timing = T.phase ? `<div class="g-phase ${T.phase}" id="gPhase">${T.phase === "ready" ? "Get ready" : T.phase === "hold" ? "Hold it" : "Rest"}</div><div class="g-clock" id="gClock">${fmt(T.remain())}</div>` : "";
      body = `<div class="g-body">${head}<h2>${esc(itemName(cur))}</h2>
        <div class="g-set">Set ${n + 1} of ${cur.s} <span>· ${esc(cur.r || cur.h + " s")}${cur.r && !cur.h ? " reps" : ""}</span></div>
        ${timing || `<p class="g-cue">${esc(itemCue(cur))}</p>`}</div>`;
      if (T.phase) acts = `<div class="g-acts"><button class="btn big" data-g="tskip">${T.phase === "rest" ? "Skip rest" : T.phase === "ready" ? "Start now" : "Done early"}</button><button class="g-link" data-g="tplus">+15 s</button></div>`;
      else if (cur.h) acts = `<div class="g-acts"><button class="btn big" data-g="hold" data-id="${cur.id}">${PLAY}Start ${cur.h} s hold</button><button class="g-link" data-g="skip" data-id="${cur.id}">Skip this exercise</button></div>`;
      else acts = `<div class="g-acts"><button class="btn big" data-g="set" data-id="${cur.id}">Done set ${n + 1}</button><button class="g-link" data-g="skip" data-id="${cur.id}">Skip this exercise</button></div>`;
    }
  }
  $("#guideIn").innerHTML = top + body + acts;
}

/* ---------- timer ---------- */
let audioCtx = null, wakeLock = null;
function unlockAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {}
}
function beep(freq = 880, dur = 0.12, delay = 0) {
  try {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function chime() { beep(784, .14, 0); beep(988, .14, .1); beep(1175, .14, .2); beep(1568, .3, .3); }
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => (wakeLock = null)); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
const T = {
  queue: [], phase: null, label: "", total: 0, end: 0, pausedLeft: null, lastBeep: null, iv: null, cur: null,
  remain() { return this.pausedLeft != null ? this.pausedLeft : (this.end - Date.now()) / 1000; },
};
function runSteps(steps) {
  unlockAudio();
  T.queue = steps.slice(); nextStep();
  if (!T.iv) T.iv = setInterval(tick, 200);
  keepAwake(true);
}
function nextStep() {
  const st = T.queue.shift();
  if (!st) return stopTimer(true);
  T.cur = st; T.phase = st.phase; T.label = st.label; T.total = st.secs; T.end = Date.now() + st.secs * 1000; T.pausedLeft = null; T.lastBeep = null;
  if (st.phase === "hold") { beep(1320, 0.2); buzz(80); }
  document.body.classList.add("timing"); $("#dock").hidden = false; paintDock();
  if (ui.guide) renderGuide();
}
function tick() {
  if (!T.phase || T.pausedLeft != null) return;
  const left = T.remain();
  const whole = Math.ceil(left);
  if (whole <= 3 && whole >= 1 && T.lastBeep !== whole) { T.lastBeep = whole; beep(880, 0.1); }
  if (left <= 0) {
    beep(T.phase === "hold" ? 660 : 1320, 0.45); buzz([120, 60, 120]);
    const done = T.cur; T.cur = null; if (done && done.onEnd) done.onEnd();
    nextStep(); return;
  }
  paintDock();
}
function paintDock() {
  if (!T.phase) return;
  const left = T.remain();
  $("#dPhase").textContent = T.phase === "ready" ? "Get ready" : T.phase === "hold" ? "Hold" : "Rest";
  $("#dPhase").className = "phase " + T.phase;
  $("#dTime").textContent = fmt(left);
  $("#dLabel").textContent = T.label;
  $("#dBar").className = "dbar " + T.phase;
  $("#dFill").style.width = Math.min(100, (1 - left / T.total) * 100) + "%";
  $("#dPause").textContent = T.pausedLeft != null ? "Resume" : "Pause";
  const big = $("#bigClock"); if (big) { big.textContent = fmt(left); $("#bigLabel").textContent = (T.phase === "ready" ? "Get ready: " : T.phase === "hold" ? "Hold: " : "Rest: ") + T.label; }
  const gc = $("#gClock"); if (gc) gc.textContent = fmt(left);
}
function stopTimer(finished) {
  T.queue = []; T.phase = null; T.cur = null; clearInterval(T.iv); T.iv = null;
  $("#dock").hidden = true; document.body.classList.remove("timing"); keepAwake(false);
  const big = $("#bigClock"); if (big) { big.textContent = "0:00"; $("#bigLabel").textContent = finished ? "Done. Pick the next one." : "Stopped."; }
  if (ui.guide) renderGuide();
}
function holdSteps(it, dk) {
  const name = itemName(it);
  const steps = [
    { phase: "ready", label: name, secs: 5 },
    { phase: "hold", label: name, secs: it.h, onEnd: () => bumpSet(dk, it) },
  ];
  const n = (entry(dk).sets[it.id] || 0) + 1;
  if (n < it.s && it.rest) steps.push({ phase: "rest", label: "Next: " + name + " set " + (n + 1), secs: it.rest });
  return steps;
}
function bumpSet(dk, it) {
  change(() => { const e = entry(dk, true); e.sets[it.id] = Math.min(it.s, (e.sets[it.id] || 0) + 1); }, { el: ui.guide ? $("#gClock") : $("#dTime") });
}
function restAfter(it, dk) {
  const n = entry(dk).sets[it.id] || 0;
  if (!it.h && it.rest && n < it.s) runSteps([{ phase: "rest", label: "Next: " + itemName(it) + " set " + (n + 1), secs: it.rest }]);
}

/* ---------- events ---------- */
function findItem(id) {
  const dk = curKey();
  const { sess } = sessionFor(ui.dayIdx, dk);
  return { it: allItems(sess).find((x) => x.id === id), dk, sess };
}
document.addEventListener("input", (ev) => {
  if (ev.target.id === "why") { S.why = ev.target.value.slice(0, 160); save(); }
});
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  unlockAudio();
  const g = t.dataset.g;
  if (g) {
    const { it, dk } = t.dataset.id ? findItem(t.dataset.id) : {};
    if (g === "close") { closeGuide(); return; }
    if (g === "wins") { closeGuide(); ui.tab = "wins"; render(); window.scrollTo(0, 0); return; }
    if (g === "check" && it) { change(() => { entry(dk, true).sets[it.id] = 1; }, { el: t }); return; }
    if (g === "skip" && it) { ui.skipped.add(it.id); renderGuide(); return; }
    if (g === "set" && it) { change(() => { const e = entry(dk, true); e.sets[it.id] = Math.min(it.s, (e.sets[it.id] || 0) + 1); }, { el: t }); restAfter(it, dk); return; }
    if (g === "hold" && it) { runSteps(holdSteps(it, dk)); return; }
    if (g === "tskip") { const c = T.cur; T.cur = null; if (c && c.phase === "hold" && c.onEnd) c.onEnd(); nextStep(); return; }
    if (g === "tplus") { if (T.pausedLeft != null) T.pausedLeft += 15; else T.end += 15000; T.total += 15; paintDock(); return; }
    return;
  }
  if (t.dataset.tab) { ui.tab = t.dataset.tab; try { history.replaceState(null, "", "#" + ui.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  if (t.dataset.day) { ui.dayIdx = +t.dataset.day; render(); return; }
  if (t.dataset.seg) { ui.movesSeg = t.dataset.seg; render(); return; }
  if (t.dataset.pip) {
    const { it, dk } = findItem(t.dataset.pip); if (!it) return;
    const i = +t.dataset.i, cur = entry(dk).sets[it.id] || 0, next = cur === i + 1 ? i : i + 1;
    const r = t.getBoundingClientRect(), anchor = { getBoundingClientRect: () => r };
    change(() => { entry(dk, true).sets[it.id] = next; }, { el: anchor });
    if (next > cur) restAfter(it, dk);
    return;
  }
  if (t.dataset.check) { const dk = curKey(), id = t.dataset.check; const r = t.getBoundingClientRect(); change(() => { const e = entry(dk, true); e.sets[id] = e.sets[id] ? 0 : 1; }, { el: { getBoundingClientRect: () => r } }); return; }
  if (t.dataset.hold) { const { it, dk } = findItem(t.dataset.hold); if (!it) return; if ((entry(dk).sets[it.id] || 0) >= it.s) { toast("All sets of this one are done"); return; } runSteps(holdSteps(it, dk)); return; }
  if (t.dataset.rest) { runSteps([{ phase: "rest", label: t.dataset.label, secs: +t.dataset.rest }]); return; }
  if (t.dataset.preset) {
    const s = +t.dataset.preset;
    runSteps(t.dataset.kind === "hold" ? [{ phase: "ready", label: s + " s hold", secs: 5 }, { phase: "hold", label: s + " s hold", secs: s }] : [{ phase: "rest", label: s + " s rest", secs: s }]);
    return;
  }
  if (t.dataset.step) { const v = +t.dataset.step; change(() => { S.step = v; }); toast("Handstand step " + (v + 1)); return; }
  const act = t.dataset.act;
  if (act === "guide") { openGuide(); return; }
  if (act === "stepup" && S.step < 4) { const r = t.getBoundingClientRect(); change(() => { S.step++; }, { el: { getBoundingClientRect: () => r } }); toast("Moved up to step " + (S.step + 1) + ". Huge."); }
  if (act === "stepdown" && S.step > 0) { change(() => { S.step--; }); }
  if (act === "finish") { const dk = curKey(); const r = t.getBoundingClientRect(); const wasDone = entry(dk).done; change(() => { const e = entry(dk, true); e.done = !e.done; }, { el: { getBoundingClientRect: () => r } }); if (!wasDone) { celebrate(true); toast("Workout logged"); } }
  if (act === "hotel") { const dk = curKey(); change(() => { const e = entry(dk, true); e.hotel = !e.hotel; }); }
  if (act === "mini") { const dk = curKey(); change(() => { const e = entry(dk, true); e.mini = !e.mini; }); window.scrollTo(0, 0); }
  if (t.id === "dPause") { if (T.pausedLeft != null) { T.end = Date.now() + T.pausedLeft * 1000; T.pausedLeft = null; } else { T.pausedLeft = T.remain(); } paintDock(); }
  if (t.id === "dPlus") { if (T.pausedLeft != null) T.pausedLeft += 15; else T.end += 15000; T.total += 15; paintDock(); }
  if (t.id === "dSkip") { const c = T.cur; T.cur = null; if (c && c.phase === "hold" && c.onEnd) c.onEnd(); nextStep(); }
  if (t.id === "dStop") stopTimer(false);
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && ui.guide) closeGuide(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && T.phase) keepAwake(true); });

/* ---------- boot ---------- */
loadLocal();
// badges already earned before this version shouldn't all pop at once
(function () { const st = computeStats(); BADGES.forEach((b) => { if (b.test(st) && !S.seen.includes(b.id)) S.seen.push(b.id); }); })();
const h = (location.hash || "").slice(1);
if (["today", "timer", "moves", "handstand", "wins"].includes(h)) ui.tab = h;
render();
initDb();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
